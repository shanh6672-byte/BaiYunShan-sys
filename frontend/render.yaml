# Render 一键部署配置
# 使用：https://dashboard.render.com → New Blueprint → 连接 GitHub 仓库

services:
  # ===== Flask 后端 =====
  - type: web
    name: baiyunshan-patrol
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baiyunshan-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # 以下需在 Render 控制台填入实际值
      - key: GEOSERVER_URL
        sync: false
      - key: GEOSERVER_USER
        sync: false
      - key: GEOSERVER_PASSWORD
        sync: false

  # ===== 静态前端（可选）=====
  - type: static
    name: baiyunshan-frontend
    rootDir: ./
    publishDir: ./
    plan: free

databases:
  - name: baiyunshan-db
    databaseName: baiyunshan
    plan: free
