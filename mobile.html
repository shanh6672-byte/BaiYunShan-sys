<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>云山智巡 - 护林员</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1628;color:#c8d6e5;height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(180deg,rgba(0,20,40,0.95),rgba(10,22,40,0.9));padding:10px 14px;border-bottom:1px solid rgba(0,213,255,0.15);display:flex;align-items:center;gap:8px}
.header h1{font-size:15px;color:#00d5ff;flex:1}
.header select{background:rgba(10,22,40,0.9);border:1px solid rgba(0,213,255,0.3);color:#c8d6e5;border-radius:6px;padding:4px 8px;font-size:12px}
.tab-bar{display:flex;background:rgba(10,22,40,0.9);border-bottom:1px solid rgba(0,213,255,0.1)}
.tab-bar a{flex:1;text-align:center;padding:10px 0;font-size:12px;color:#78909c;text-decoration:none;border-bottom:2px solid transparent}
.tab-bar a.active{color:#00d5ff;border-bottom-color:#00d5ff}
.page{flex:1;overflow-y:auto;display:none}
.page.active{display:block}
#map{height:55vh;width:100%}
.task-card{background:rgba(10,22,40,0.9);margin:8px;padding:12px;border-radius:8px;border:1px solid rgba(0,213,255,0.1)}
.task-card .tnum{font-size:11px;color:#78909c}
.task-card .tname{font-size:15px;color:#fff;margin:4px 0}
.task-card .tmeta{font-size:11px;color:#90a4ae}
.task-card .tstatus{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;margin-top:6px}
.status-pending{background:rgba(255,152,0,0.2);color:#ff9800}
.status-running{background:rgba(0,230,118,0.2);color:#00e676}
.status-done{background:rgba(0,213,255,0.2);color:#00d5ff}
.info-bar{background:rgba(10,22,40,0.95);padding:10px 14px;border-top:1px solid rgba(0,213,255,0.15)}
.info-bar .stat-row{display:flex;justify-content:space-around;text-align:center;margin-bottom:8px}
.info-bar .stat-val{font-size:18px;font-weight:700;color:#00d5ff}
.info-bar .stat-label{font-size:10px;color:#78909c}
.btn-row{display:flex;gap:8px;padding:8px 14px;background:rgba(10,22,40,0.95)}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-accept{background:linear-gradient(135deg,#00d5ff,#0091ea);color:#fff}
.btn-start{background:linear-gradient(135deg,#00e676,#00c853);color:#000}
.btn-finish{background:linear-gradient(135deg,#ff6e40,#ff3d3d);color:#fff}
.btn-upload{background:linear-gradient(135deg,#7c4dff,#651fff);color:#fff}
.btn:disabled{opacity:0.35;pointer-events:none}
.log-list{list-style:none;padding:8px}
.log-list li{background:rgba(10,22,40,0.9);margin:4px 8px;padding:10px;border-radius:6px;border-left:3px solid #00d5ff;font-size:12px}
.log-list .log-time{color:#78909c;font-size:10px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,213,255,0.9);color:#000;padding:10px 24px;border-radius:8px;font-size:13px;z-index:9999;display:none}
.photo-preview{width:80px;height:80px;border-radius:8px;object-fit:cover;margin:4px;border:1px solid rgba(0,213,255,0.2)}
</style>
</head>
<body>
<div class="header">
    <h1>🌲 云山智巡</h1>
    <select id="rangerSelect" onchange="switchRanger()"></select>
</div>
<div class="tab-bar">
    <a class="active" data-tab="tab-tasks" onclick="switchTab('tab-tasks')">📋 我的任务</a>
    <a data-tab="tab-map" onclick="switchTab('tab-map')">🗺 地图</a>
    <a data-tab="tab-report" onclick="switchTab('tab-report')">🚨 上报</a>
    <a data-tab="tab-log" onclick="switchTab('tab-log')">📝 日志</a>
</div>

<!-- 任务列表 -->
<div class="page active" id="tab-tasks"><div id="taskList"></div></div>

<!-- 地图 + 控制 -->
<div class="page" id="tab-map">
    <div id="map"></div>
    <div class="info-bar" id="infoBar">
        <div class="stat-row">
            <div><div class="stat-val" id="distVal">--</div><div class="stat-label">里程(km)</div></div>
            <div><div class="stat-val" id="timeVal">--</div><div class="stat-label">已巡护</div></div>
            <div><div class="stat-val" id="progVal">0</div><div class="stat-label">进度(%)</div></div>
            <div><div class="stat-val" id="ptsVal">0</div><div class="stat-label">轨迹点</div></div>
        </div>
    </div>
    <div class="btn-row">
        <button class="btn btn-accept" id="btnAccept" onclick="acceptTask()">📋 接受</button>
        <button class="btn btn-start" id="btnStart" onclick="startPatrol()" disabled>▶ 开始巡护</button>
        <button class="btn btn-finish" id="btnFinish" onclick="finishPatrol()" disabled>✓ 完成</button>
        <button class="btn btn-upload" id="btnPhoto" onclick="takePhoto()" disabled>📷</button>
    </div>
</div>

<!-- 巡护日志 -->
<div class="page" id="tab-log">
    <ul class="log-list" id="logList"><li>暂无巡护日志</li></ul>
</div>

<!-- 火情/疫情上报 -->
<div class="page" id="tab-report">
    <div style="padding:12px">
        <div style="background:rgba(10,22,40,0.9);border-radius:8px;padding:14px;border:1px solid rgba(255,61,61,0.2)">
            <h2 style="color:#ff3d3d;font-size:16px;margin-bottom:12px">🚨 灾害上报</h2>

            <div style="margin-bottom:10px">
                <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">灾害类型</label>
                <select id="reportType" onchange="toggleReportFields()" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#fff;border-radius:6px;padding:8px;font-size:13px">
                    <option value="fire">🔥 火情</option>
                    <option value="pest">🐛 疫情</option>
                </select>
            </div>

            <div style="margin-bottom:10px">
                <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">名称</label>
                <input id="reportName" type="text" placeholder="如：一号林区火情" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#fff;border-radius:6px;padding:8px;font-size:13px"/>
            </div>

            <div style="margin-bottom:10px">
                <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">📍 当前坐标（GPS自动获取）</label>
                <div style="display:flex;gap:6px">
                    <input id="reportLat" type="text" placeholder="纬度" readonly style="flex:1;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#00d5ff;border-radius:6px;padding:8px;font-size:13px"/>
                    <input id="reportLng" type="text" placeholder="经度" readonly style="flex:1;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#00d5ff;border-radius:6px;padding:8px;font-size:13px"/>
                    <button onclick="getGpsForReport()" style="background:#00d5ff;color:#000;border:none;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600">定位</button>
                </div>
                <div id="gpsStatus" style="font-size:11px;color:#78909c;margin-top:4px"></div>
            </div>

            <div id="fireFields" style="margin-bottom:10px">
                <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">风险等级</label>
                <select id="reportRiskLevel" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#fff;border-radius:6px;padding:8px;font-size:13px">
                    <option value="高">高</option>
                    <option value="中" selected>中</option>
                    <option value="低">低</option>
                </select>
                <div style="display:flex;gap:8px;margin-top:8px">
                    <div style="flex:1">
                        <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">温度(°C)</label>
                        <input id="reportTemp" type="number" value="60" step="0.1" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#fff;border-radius:6px;padding:8px;font-size:13px"/>
                    </div>
                    <div style="flex:1">
                        <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">面积(亩)</label>
                        <input id="reportArea" type="number" value="10" step="0.1" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#fff;border-radius:6px;padding:8px;font-size:13px"/>
                    </div>
                </div>
            </div>

            <div id="pestFields" style="display:none;margin-bottom:10px">
                <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">病虫害类型</label>
                <select id="reportDiseaseType" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#fff;border-radius:6px;padding:8px;font-size:13px">
                    <option>松材线虫病</option>
                    <option>美国白蛾</option>
                    <option>松毛虫</option>
                    <option>其他</option>
                </select>
                <div style="display:flex;gap:8px;margin-top:8px">
                    <div style="flex:1">
                        <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">置信度(%)</label>
                        <input id="reportConfidence" type="number" value="75" min="0" max="100" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#fff;border-radius:6px;padding:8px;font-size:13px"/>
                    </div>
                    <div style="flex:1">
                        <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">面积(亩)</label>
                        <input id="reportPestArea" type="number" value="5" step="0.1" style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#fff;border-radius:6px;padding:8px;font-size:13px"/>
                    </div>
                </div>
            </div>

            <div style="margin-bottom:10px">
                <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">现场描述</label>
                <textarea id="reportDesc" rows="2" placeholder="现场情况描述..." style="width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(0,213,255,0.2);color:#fff;border-radius:6px;padding:8px;font-size:13px;resize:vertical"></textarea>
            </div>

            <div style="margin-bottom:12px">
                <label style="font-size:12px;color:#78909c;display:block;margin-bottom:4px">📷 现场照片</label>
                <button onclick="captureReportPhoto()" style="width:100%;background:linear-gradient(135deg,#7c4dff,#651fff);color:#fff;border:none;border-radius:6px;padding:10px;font-size:13px;font-weight:600">📷 拍照 / 选择图片</button>
                <div id="reportPhotoPreview" style="margin-top:8px"></div>
                <input id="reportImage" type="file" accept="image/*" capture="environment" style="display:none" onchange="previewReportPhoto(this)"/>
            </div>

            <button id="btnSubmitReport" onclick="submitReport()" style="width:100%;background:linear-gradient(135deg,#ff6e40,#ff3d3d);color:#fff;border:none;border-radius:8px;padding:14px;font-size:14px;font-weight:600">🚨 立即上报</button>
            <div id="reportStatus" style="font-size:12px;text-align:center;margin-top:8px"></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = window.location.origin;
let token = '', currentRanger = null, currentTask = null;
let map, routeLine, trackLine, posMarker;
let patrolTimer = null, patrolRunning = false;
let gpsPoints = [], patrolLogs = [];

// ========== 切换护林员 ==========
async function loadRangers() {
    const res = await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'admin'})});
    const d=await res.json(); if(d.success) token=d.token;
    const rr=await fetch(API+'/api/rangers',{headers:{'Authorization':'Bearer '+token}});
    const rangers=await rr.json();
    const sel=document.getElementById('rangerSelect');
    sel.innerHTML='<option value="">选择护林员</option>';
    rangers.forEach(r=>{sel.innerHTML+=`<option value="${r.id}">${r.name} - ${r.area}</option>`;});
}

async function switchRanger(){
    const id=document.getElementById('rangerSelect').value;
    if(!id)return;
    const rr=await fetch(API+'/api/rangers/'+parseInt(id.replace(/\D/g,'')),{headers:{'Authorization':'Bearer '+token}});
    currentRanger=await rr.json();
    loadMyTasks();
}

// ========== Tab ==========
function switchTab(tabId){
    document.querySelectorAll('.tab-bar a').forEach(a=>a.classList.remove('active'));
    document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(tabId==='tab-map') setTimeout(()=>{if(map)map.invalidateSize();},300);
}

// ========== 我的任务 ==========
async function loadMyTasks(){
    if(!currentRanger)return;
    const rid=parseInt(currentRanger.id.replace(/\D/g,''));
    const tasks=await fetch(API+'/api/mobile/tasks?ranger_id='+rid).then(r=>r.json());
    const list=document.getElementById('taskList');
    if(!tasks.length){list.innerHTML='<div style="padding:20px;text-align:center;color:#78909c">暂无任务</div>';return;}
    list.innerHTML=tasks.map(t=>{
        const sc=t.status==='待执行'?'status-pending':t.status==='进行中'?'status-running':'status-done';
        return`<div class="task-card" onclick="selectTask('${t.id}')">
            <div class="tnum">${t.taskNumber}</div>
            <div class="tname">${t.name}</div>
            <div class="tmeta">${t.area} · ${t.timeStart}~${t.timeEnd}</div>
            <span class="${sc}">${t.status}</span>
        </div>`;
    }).join('');
}

async function selectTask(taskId){
    const id=parseInt(taskId.replace(/\D/g,''));
    const t=await fetch(API+'/api/patrol/tasks/'+id,{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json());
    currentTask=t; switchTab('tab-map');
    drawRouteAndMap(t);
}

// ========== 地图 + 路线 ==========
function initMap(){
    map=L.map('map',{zoomControl:false}).setView([28.500,119.920],13);
    L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'&copy; 高德地图'}).addTo(map);
    L.control.zoom({position:'topright'}).addTo(map);
    // 尝试GPS定位
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(p=>{
            map.setView([p.coords.latitude,p.coords.longitude],15);
            L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:8,color:'#00e676',fillOpacity:1}).addTo(map).bindTooltip('我的位置');
        },()=>{});
    }
}

function drawRouteAndMap(task){
    if(routeLine)map.removeLayer(routeLine);
    if(trackLine)map.removeLayer(trackLine);
    if(posMarker)map.removeLayer(posMarker);

    gpsPoints=[]; document.getElementById('ptsVal').textContent='0';
    document.getElementById('progVal').textContent=task.progress||'0';

    // 规划路线
    try{
        const geo=JSON.parse(task.routeGeometry||'{}');
        if(geo.coordinates){
            const coords=geo.coordinates.map(c=>[c[1],c[0]]);
            routeLine=L.polyline(coords,{color:'#00d5ff',weight:3,opacity:0.8,dashArray:'10,6'}).addTo(map);
            map.fitBounds(routeLine.getBounds(),{padding:[40,40]});
            document.getElementById('distVal').textContent=(coords.length*0.25).toFixed(1);
        }
    }catch(e){}
    // 实际轨迹
    try{
        const at=JSON.parse(task.actualTrack||'{}');
        if(at.coordinates&&at.coordinates.length){
            const coords=at.coordinates.map(c=>[c[1],c[0]]);
            trackLine=L.polyline(coords,{color:'#00e676',weight:4,opacity:0.9}).addTo(map);
            document.getElementById('ptsVal').textContent=coords.length;
            document.getElementById('progVal').textContent=Math.min(100,Math.round(coords.length/80*100));
        }
    }catch(e){}

    // 按钮状态
    const btnA=document.getElementById('btnAccept');
    const btnS=document.getElementById('btnStart');
    const btnF=document.getElementById('btnFinish');
    const btnP=document.getElementById('btnPhoto');
    btnA.disabled=task.status!=='待执行';
    btnS.disabled=!(task.status==='待执行'||task.status==='进行中')||patrolRunning;
    btnF.disabled=!patrolRunning;
    btnP.disabled=!patrolRunning;
    document.getElementById('timeVal').textContent=patrolRunning?'巡护中...':'--';
}

// ========== 任务操作 ==========
async function acceptTask(){
    if(!currentTask)return;
    await fetch(API+'/api/patrol/tasks/'+parseInt(currentTask.id.replace(/\D/g,'')),{
        method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({status:'进行中',progress:0})
    });
    currentTask.status='进行中'; drawRouteAndMap(currentTask);
    addLog('接受任务: '+currentTask.name);
    toast('✅ 任务已接受');
}

async function startPatrol(){
    if(!currentTask)return;
    patrolRunning=true;
    document.getElementById('btnStart').disabled=true;
    document.getElementById('btnFinish').disabled=false;
    document.getElementById('btnPhoto').disabled=false;
    document.getElementById('timeVal').textContent='巡护中...';
    addLog('开始巡护: '+currentTask.name);

    // GPS追踪 - 每5秒上传
    function uploadGps(){
        if(!patrolRunning)return;
        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(async p=>{
                const lat=p.coords.latitude, lng=p.coords.longitude;
                gpsPoints.push([lat,lng]);
                document.getElementById('ptsVal').textContent=gpsPoints.length;
                document.getElementById('progVal').textContent=Math.min(100,Math.round(gpsPoints.length/80*100));
                // 更新地图
                if(trackLine)map.removeLayer(trackLine);
                if(gpsPoints.length>1)trackLine=L.polyline(gpsPoints,{color:'#00e676',weight:4,opacity:0.9}).addTo(map);
                if(posMarker)map.removeLayer(posMarker);
                posMarker=L.circleMarker([lat,lng],{radius:8,color:'#00e676',fillOpacity:1}).addTo(map).bindTooltip('当前位置');
                // 上传
                await fetch(API+'/api/patrol/tasks/'+parseInt(currentTask.id.replace(/\D/g,''))+'/gps',{
                    method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({lat,lng,speed:p.coords.speed||3,accuracy:p.coords.accuracy||5})
                });
            },()=>{
                // GPS不可用，模拟位置
                const lat=28.500+Math.random()*0.02, lng=119.910+Math.random()*0.02;
                gpsPoints.push([lat,lng]);
                document.getElementById('ptsVal').textContent=gpsPoints.length;
                fetch(API+'/api/patrol/tasks/'+parseInt(currentTask.id.replace(/\D/g,''))+'/gps',{
                    method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({lat,lng,speed:3,accuracy:10})
                });
            });
        }
    }
    uploadGps();
    patrolTimer=setInterval(uploadGps,5000);
    toast('▶ 巡护已开始');
}

async function finishPatrol(){
    if(patrolTimer)clearInterval(patrolTimer);
    patrolRunning=false;
    await fetch(API+'/api/patrol/tasks/'+parseInt(currentTask.id.replace(/\D/g,'')),{
        method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({status:'已完成',progress:100})
    });
    document.getElementById('progVal').textContent='100';
    document.getElementById('btnStart').disabled=true;
    document.getElementById('btnFinish').disabled=true;
    document.getElementById('btnPhoto').disabled=true;
    addLog('完成巡护: '+currentTask.name+' | 共'+gpsPoints.length+'个轨迹点');
    toast('✅ 巡护完成！');
}

// ========== 拍照 ==========
function takePhoto(){
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.capture='environment';
    inp.onchange=async()=>{
        if(inp.files[0]){
            addLog('📷 拍照上传: '+inp.files[0].name);
            toast('📷 照片已记录');
        }
    };
    inp.click();
}

// ========== 日志 ==========
function addLog(msg){
    const now=new Date();
    const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');
    patrolLogs.unshift({time,msg});
    document.getElementById('logList').innerHTML=patrolLogs.slice(0,50).map(l=>`<li><span class="log-time">${l.time}</span> ${l.msg}</li>`).join('');
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}

// ========== 火情/疫情上报 ==========
function toggleReportFields(){
    const type=document.getElementById('reportType').value;
    document.getElementById('fireFields').style.display=type==='fire'?'block':'none';
    document.getElementById('pestFields').style.display=type==='pest'?'block':'none';
}

function getGpsForReport(){
    const status=document.getElementById('gpsStatus');
    status.style.color='#ffab00';
    status.textContent='📍 正在获取GPS定位...';
    if(!navigator.geolocation){
        status.style.color='#ff6b6b';
        status.textContent='❌ 设备不支持GPS';
        return;
    }
    navigator.geolocation.getCurrentPosition(p=>{
        document.getElementById('reportLat').value=p.coords.latitude.toFixed(6);
        document.getElementById('reportLng').value=p.coords.longitude.toFixed(6);
        status.style.color='#00e676';
        status.textContent='✅ 定位成功（精度±'+Math.round(p.coords.accuracy||0)+'米）';
    },err=>{
        // GPS失败时用护林员当前位置或默认坐标
        const lat=currentRanger?currentRanger.lat:28.467;
        const lng=currentRanger?currentRanger.lng:119.922;
        document.getElementById('reportLat').value=lat.toFixed(6);
        document.getElementById('reportLng').value=lng.toFixed(6);
        status.style.color='#ff9800';
        status.textContent='⚠ GPS不可用，已使用护林员默认位置';
    },{enableHighAccuracy:true,timeout:8000,maximumAge:0});
}

function captureReportPhoto(){
    document.getElementById('reportImage').click();
}

function previewReportPhoto(input){
    const preview=document.getElementById('reportPhotoPreview');
    if(input.files&&input.files[0]){
        const reader=new FileReader();
        reader.onload=e=>{preview.innerHTML='<img src="'+e.target.result+'" style="width:100%;max-height:200px;object-fit:cover;border-radius:8px;border:1px solid rgba(0,213,255,0.3)"/>'};
        reader.readAsDataURL(input.files[0]);
    }
}

async function submitReport(){
    const status=document.getElementById('reportStatus');
    const btn=document.getElementById('btnSubmitReport');
    const lat=document.getElementById('reportLat').value;
    const lng=document.getElementById('reportLng').value;

    if(!lat||!lng){
        status.style.color='#ff6b6b';
        status.textContent='❌ 请先获取GPS坐标';
        toast('请先点击定位按钮');
        return;
    }

    btn.disabled=true;
    btn.textContent='上报中...';
    status.style.color='#ffab00';
    status.textContent='正在上传...';

    try{
        const fd=new FormData();
        const type=document.getElementById('reportType').value;
        fd.append('type',type);
        fd.append('name',document.getElementById('reportName').value||(type==='fire'?'火情':'疫情'));
        fd.append('lat',lat);
        fd.append('lng',lng);
        // 上报人：当前选中的护林员
        const reporter=currentRanger?currentRanger.name:'匿名护林员';
        fd.append('reportedBy',reporter);
        fd.append('description',document.getElementById('reportDesc').value||'');
        if(type==='fire'){
            fd.append('riskLevel',document.getElementById('reportRiskLevel').value);
            fd.append('temperatureC',document.getElementById('reportTemp').value);
            fd.append('areaMu',document.getElementById('reportArea').value);
        }else{
            fd.append('diseaseType',document.getElementById('reportDiseaseType').value);
            fd.append('confidence',document.getElementById('reportConfidence').value);
            fd.append('affectedAreaMu',document.getElementById('reportPestArea').value);
        }
        const imgInput=document.getElementById('reportImage');
        if(imgInput.files[0])fd.append('image',imgInput.files[0]);

        const res=await fetch(API+'/api/disasters/upload',{
            method:'POST',
            headers:{'Authorization':'Bearer '+token},
            body:fd
        });
        const data=await res.json();
        if(data.success){
            status.style.color='#00e676';
            status.textContent='✅ 上报成功！指挥中心已收到';
            toast('✅ 上报成功');
            addLog('🚨 上报'+(type==='fire'?'火情':'疫情')+': '+(document.getElementById('reportName').value||'未命名')+' @'+lat+','+lng);
            // 清空表单
            document.getElementById('reportName').value='';
            document.getElementById('reportDesc').value='';
            document.getElementById('reportPhotoPreview').innerHTML='';
            imgInput.value='';
            // 3秒后跳到地图tab看效果
            setTimeout(()=>{switchTab('tab-map');status.textContent='';},3000);
        }else{
            throw new Error(data.error||'上报失败');
        }
    }catch(e){
        status.style.color='#ff6b6b';
        status.textContent='❌ 上报失败: '+e.message;
        toast('上报失败');
    }
    btn.disabled=false;
    btn.textContent='🚨 立即上报';
}

// ========== 启动 ==========
loadRangers(); initMap();
</script>
